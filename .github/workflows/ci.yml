# Verifies the whole workspace: types, any-ban, tests, build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: No-any gate
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -E ': any\b|as any\b|<\s*any\s*>' packages/*/src packages/*/test; then
            echo 'ERROR: explicit any found (see above)'
            exit 1
          fi
          echo 'no-any gate passed'

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
