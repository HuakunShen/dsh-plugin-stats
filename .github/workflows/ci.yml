# Verifies the whole workspace: types, any-ban, tests, build, and the shape of
# what would be published.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: No-any gate
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -E ': any\b|as any\b|<\s*any\s*>' packages/*/src packages/*/test; then
            echo 'ERROR: explicit any found (see above)'
            exit 1
          fi
          echo 'no-any gate passed'

      - name: Test
        run: pnpm -r test

      - name: Build the plugin bundle
        run: pnpm --filter dsh-plugin-stats build

      # The published plugin inlines everything it needs, so it must declare no
      # runtime dependencies — otherwise a `workspace:` protocol would leak into
      # the manifest npm serves and break installs.
      - name: The published plugin declares no runtime dependencies
        run: |
          DEPS=$(node -p "JSON.stringify(require('./packages/plugin/package.json').dependencies ?? {})")
          if [ "$DEPS" != "{}" ]; then
            echo "packages/plugin/package.json declares runtime dependencies: $DEPS" >&2
            echo "the Host and client bundles inline their dependencies; move these to devDependencies" >&2
            exit 1
          fi
          echo 'plugin runtime dependencies: none'

      - name: Pack dry run (the shipped package)
        working-directory: packages/plugin
        run: npm pack --dry-run
