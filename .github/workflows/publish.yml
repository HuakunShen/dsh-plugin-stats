# Publishes @dsh-stats/core, @dsh-stats/pricing, and dsh-plugin-stats to the
# npm registry through npm Trusted Publishing: the OIDC token minted by
# GitHub Actions identifies this repository against the trusted publisher
# configured on npmjs.com, so no npm token secret is needed. Requires
# `permissions.id-token: write`.
#
# npm side (each package -> Settings -> Trusted Publisher) must name this
# repository and this workflow filename, with the "Allow npm publish" action
# enabled — leaving it unchecked only permits `npm stage publish`, which this
# workflow does not use.
#
# Triggers: a GitHub Release marked as published, or a manual run
# (Actions -> publish -> Run workflow). Bump `version` in each package.json
# first: npm rejects a version that already exists. Publish order matters —
# core and pricing first, the bundle last — and every `npm publish` runs
# with `--provenance` so the registry records the build attestation.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm -r typecheck
          pnpm -r test
          pnpm -r build

      - name: Publish @dsh-stats/core
        run: npm publish --provenance --access public
        working-directory: packages/core
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @dsh-stats/pricing
        run: npm publish --provenance --access public
        working-directory: packages/pricing
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish dsh-plugin-stats
        run: npm publish --provenance --access public
        working-directory: packages/plugin
        env:
          NPM_CONFIG_PROVENANCE: true
