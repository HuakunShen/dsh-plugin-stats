# Publishes dsh-plugin-stats to npm. One tag runs the gates and ships exactly
# one artifact — the same release shape the other Harness plugin lines use:
#
#   plugin-v0.1.0 -> dsh-plugin-stats
#
# @dsh-stats/core and @dsh-stats/pricing are workspace-internal (`private`,
# never published): the plugin bundle inlines them, along with zod and
# @deepseek-ai/schemastery, which is why the shipped package declares no
# runtime dependencies and has nothing to resolve at install time.
#
# Auth is npm trusted publishing (OIDC), not a token: the package's Trusted
# Publisher settings on npmjs.com must name this repository, this workflow
# file, and the `npm` environment declared below. The OIDC claim is also what
# produces the public `--provenance` attestation.
#
# A name that does not exist on npm yet cannot carry trusted-publisher
# settings, so the very first version is published manually (see
# PUBLISHING.md); every release after that goes through here.
name: publish

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish with
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  plugin:
    name: Publish dsh-plugin-stats
    runs-on: ubuntu-latest
    environment: npm
    if: >-
      startsWith(github.ref, 'refs/tags/plugin-v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # The bundle inlines @dsh-stats/core and @dsh-stats/pricing, so the whole
      # workspace's types and tests gate this release, not just the plugin's.
      - name: Verify the workspace
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Build the bundle
        run: pnpm --filter dsh-plugin-stats build

      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest

      - name: The tag names the version package.json carries
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#plugin-v}"
          DECLARED=$(node -p "require('./packages/plugin/package.json').version")
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "tag plugin-v$VERSION but package.json says $DECLARED" >&2
            exit 1
          fi

      - name: Publish
        run: ./.github/scripts/publish-package.sh packages/plugin "${{ inputs.tag }}"
